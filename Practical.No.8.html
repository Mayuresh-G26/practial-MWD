<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Background: 3-color left-to-right gradient + grid */
        body {
            background:
                linear-gradient(
                    90deg,
                    #dbeafe 0%,
                    #e0e7ff 50%,
                    #fce7f3 100%
                );
            background-image:
                linear-gradient(rgba(255,255,255,0.35) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.35) 1px, transparent 1px),
                linear-gradient(
                    90deg,
                    #dbeafe 0%,
                    #e0e7ff 50%,
                    #fce7f3 100%
                );
            background-size: 30px 30px, 30px 30px, 100% 100%;
        }
    </style>
</head>

<body>

    <div class="max-w-md mx-auto mt-10 bg-white p-6 rounded-xl shadow-lg">

        <h2 class="text-2xl font-bold mb-5 text-center text-gray-800">
            Student Registration
        </h2>

        <form id="registrationForm">

            <!-- Name -->
            <label class="font-medium">Student Name</label>
            <input type="text" id="name"
                class="w-full border p-2 mb-3 rounded">

            <!-- Email -->
            <label class="font-medium">Email</label>
            <input type="text" id="email"
                class="w-full border p-2 mb-3 rounded">

            <!-- Password -->
            <label class="font-medium">Password</label>

            <div class="flex mb-3">
                <input type="password" id="password"
                    class="w-full border p-2 rounded-l">

                <button type="button" id="showPassword"
                    class="bg-gray-700 text-white px-4 rounded-r hover:bg-gray-800">
                    Show
                </button>
            </div>

            <!-- Mobile -->
            <label class="font-medium">Mobile Number</label>
            <input type="text" id="mobile"
                class="w-full border p-2 mb-4 rounded">

            <button type="submit"
                class="w-full bg-blue-500 hover:bg-blue-600 text-white p-2 rounded">
                Register
            </button>

            <p id="message" class="mt-4 text-center"></p>

        </form>
    </div>


    <script>

        // Show / Hide Password
        document.getElementById("showPassword").onclick = function() {

            let password = document.getElementById("password");

            if (password.type === "password") {
                password.type = "text";
                this.innerHTML = "Hide";
            } else {
                password.type = "password";
                this.innerHTML = "Show";
            }

        };


        // Registration Validation
        document.getElementById("registrationForm").onsubmit = function(event) {

            event.preventDefault();

            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;
            let mobile = document.getElementById("mobile").value;

            let message = document.getElementById("message");

            // Mandatory fields
            if (name == "" || email == "" || password == "" || mobile == "") {
                message.innerHTML = "Please fill all fields.";
                message.className = "mt-4 text-center text-red-500";
                return;
            }

            // Email validation
            if (!email.includes("@") || !email.includes(".")) {
                message.innerHTML = "Enter a valid email.";
                message.className = "mt-4 text-center text-red-500";
                return;
            }

            // Password validation
            if (password.length < 6) {
                message.innerHTML = "Password must be at least 6 characters.";
                message.className = "mt-4 text-center text-red-500";
                return;
            }

            // Mobile validation
            if (mobile.length != 10 || isNaN(mobile)) {
                message.innerHTML = "Enter a valid 10-digit mobile number.";
                message.className = "mt-4 text-center text-red-500";
                return;
            }

            // Success
            message.innerHTML = "Registration Successful!";
            message.className = "mt-4 text-center text-green-500";

        };

    </script>

</body>
</html>
