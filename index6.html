<!DOCTYPE html>
<html>
<head>
    <title>Student Grade Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 flex items-center justify-center px-5 py-10">

    <main class="w-full max-w-lg">
        <section class="bg-white rounded-2xl shadow-2xl overflow-hidden">

            <div class="bg-slate-900 px-8 py-8">
                <div class="flex items-center gap-4">
                    <div class="h-12 w-12 rounded-xl bg-white flex items-center justify-center text-slate-900 font-black text-xl">
                        G
                    </div>
                    <div>
                        <p class="text-xs tracking-[0.2em] text-slate-400 font-semibold">
                            STUDENT PORTAL
                        </p>
                        <h2 class="text-2xl font-bold text-white mt-1">
                            Student Grade Calculator
                        </h2>
                    </div>
                </div>
            </div>

            <div class="p-8">

                <div class="grid gap-5">

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">
                            Enter Marks 1
                        </label>
                        <input type="number" id="m1"
                            class="w-full px-4 py-3 bg-slate-50 border-2 border-slate-200 rounded-xl text-slate-800 outline-none focus:border-slate-900 focus:bg-white transition"
                            placeholder="Enter marks">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">
                            Enter Marks 2
                        </label>
                        <input type="number" id="m2"
                            class="w-full px-4 py-3 bg-slate-50 border-2 border-slate-200 rounded-xl text-slate-800 outline-none focus:border-slate-900 focus:bg-white transition"
                            placeholder="Enter marks">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">
                            Enter Marks 3
                        </label>
                        <input type="number" id="m3"
                            class="w-full px-4 py-3 bg-slate-50 border-2 border-slate-200 rounded-xl text-slate-800 outline-none focus:border-slate-900 focus:bg-white transition"
                            placeholder="Enter marks">
                    </div>

                </div>

                <button onclick="calculate()"
                    class="w-full mt-7 py-3.5 rounded-xl bg-slate-900 text-white font-bold hover:bg-slate-800 active:scale-[0.99] transition shadow-lg">
                    Calculate Result
                </button>

                <div id="result"
                    class="mt-6 p-5 min-h-24 rounded-xl border-2 border-dashed border-slate-200 bg-slate-50 text-center text-slate-700">
                </div>

            </div>
        </section>

        <p class="text-center text-xs text-slate-500 mt-5">
            Enter all three subject marks to calculate your result.
        </p>
    </main>

    <script>

        function calculate() {

            let m1 = Number(document.getElementById("m1").value);
            let m2 = Number(document.getElementById("m2").value);
            let m3 = Number(document.getElementById("m3").value);

            let total = m1 + m2 + m3;

            let percentage = total / 3;

            let grade;

            if (percentage >= 90) {
                grade = "A+";
            }
            else if (percentage >= 80) {
                grade = "A";
            }
            else if (percentage >= 70) {
                grade = "B";
            }
            else if (percentage >= 60) {
                grade = "C";
            }
            else if (percentage >= 40) {
                grade = "D";
            }
            else {
                grade = "F";
            }

            document.getElementById("result").innerHTML =
                "Total Marks: " + total + "<br>" +
                "Percentage: " + percentage + "%<br>" +
                "Grade: " + grade;
        }

    </script>

</body>
</html>
